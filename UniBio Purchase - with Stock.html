<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>UniBio Purchase</title>
    <style>
        :root {
            --bg: #1a1f1e;
            --card: #212827;
            --line: #2e3837;
            --tx: #e9ece9;
            --mut: #9aa6a3;
            --side: #1e3a5f;
            --acc: #c47a38;
            --ok: #3f9d68;
            --bad: #d4623e;
            --warn: #d9a441;
            --inp: #171c1b;
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:light) {
            :root:not([data-theme="dark"]) {
                --bg: #f4f5f3;
                --card: #fff;
                --line: #d9dedc;
                --tx: #1c2321;
                --mut: #5d6a67;
                --inp: #f7f8f7;
                --ok: #2e7d4f;
                --bad: #b8472a;
                --warn: #9a6f10;
                color-scheme: light
            }
        }

        :root[data-theme="light"] {
            --bg: #f4f5f3;
            --card: #fff;
            --line: #d9dedc;
            --tx: #1c2321;
            --mut: #5d6a67;
            --inp: #f7f8f7;
            --ok: #2e7d4f;
            --bad: #b8472a;
            --warn: #9a6f10;
            color-scheme: light
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif
        }

        .app {
            display: grid;
            grid-template-columns: 230px 1fr;
            min-height: 100vh
        }

        aside {
            background: var(--side);
            padding: 22px 12px;
            display: flex;
            flex-direction: column;
            color: #e9eef5
        }

        .logo {
            font: 700 22px Georgia, "Times New Roman", serif;
            padding: 0 10px 22px
        }

        .logo i {
            color: var(--acc);
            font-style: normal
        }

        nav button {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            text-align: left;
            background: none;
            border: 0;
            color: #c9d6e6;
            padding: 10px;
            border-radius: 8px;
            font: inherit;
            cursor: pointer;
            margin-bottom: 2px
        }

        nav button:before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8aa0bb
        }

        nav button.on {
            background: rgba(255, 255, 255, .14);
            color: #fff;
            font-weight: 600
        }

        .badge {
            margin-left: auto;
            background: var(--acc);
            color: #fff;
            border-radius: 10px;
            padding: 0 7px;
            font-size: 11px
        }

        .who {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, .15);
            padding: 14px 10px 0;
            font-size: 12px;
            color: #9fb2c9;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .who-card {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .who-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--acc);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }

        .who-details {
            min-width: 0;
            flex: 1;
        }

        .who-name {
            font-weight: 600;
            color: #fff;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .who-role {
            font-size: 11px;
            color: #a4b8cc;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .who-site {
            font-size: 10px;
            color: #8aa0bb;
            background: rgba(255, 255, 255, .08);
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
            display: inline-block;
            max-width: 100%;
        }

        .btn-logout {
            width: 100%;
            background: rgba(255, 255, 255, .08);
            color: #c9d6e6;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-logout:hover {
            background: rgba(212, 98, 62, .25);
            border-color: var(--bad);
            color: #fff;
        }

        /* Embedded Login Screen */
        .auth-view {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            position: relative;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 1;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-header .logo {
            font: 700 32px Georgia, serif;
            display: inline-block;
            padding: 0;
        }

        .brand-header .sub-brand {
            font-size: 12px;
            font-weight: 600;
            color: var(--mut);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .auth-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 30px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .auth-card h2 {
            font: 700 20px Georgia, serif;
            margin: 0 0 4px;
        }

        .auth-card p.auth-desc {
            font-size: 13px;
            color: var(--mut);
            margin: 0 0 20px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .pw-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--mut);
            cursor: pointer;
            font-size: 12px;
            padding: 4px;
        }

        .pw-toggle:hover {
            color: var(--tx);
        }

        .row-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin: 10px 0 20px;
            color: var(--mut);
        }

        .remember-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .remember-wrap input[type="checkbox"] {
            accent-color: var(--acc);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: var(--acc);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font: 600 15px inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.18s;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
        }

        .demo-section {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px dashed var(--line);
        }

        .demo-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--mut);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
        }

        .demo-btn {
            background: var(--inp);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--tx);
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .demo-btn:hover {
            border-color: var(--acc);
            background: rgba(196, 122, 56, 0.08);
            transform: translateY(-1px);
        }

        .demo-role {
            font-size: 11px;
            font-weight: 600;
            color: var(--acc);
        }

        .demo-name {
            font-size: 11px;
            color: var(--mut);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .msg-banner {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .msg-banner.error {
            display: block;
            background: rgba(212, 98, 62, 0.15);
            color: #f78d70;
            border: 1px solid rgba(212, 98, 62, 0.3);
        }

        .msg-banner.info {
            display: block;
            background: rgba(30, 58, 95, 0.35);
            color: #9fb2c9;
            border: 1px solid rgba(138, 160, 187, 0.3);
        }

        .msg-banner.success {
            display: block;
            background: rgba(63, 157, 104, 0.15);
            color: #6ed199;
            border: 1px solid rgba(63, 157, 104, 0.3);
        }

        main {
            padding: 26px 30px;
            min-width: 0
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap
        }

        h1 {
            font: 700 28px Georgia, serif;
            margin: 0
        }

        .sub {
            color: var(--mut);
            margin-top: 2px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px
        }

        .card h3 {
            margin: 0 0 14px;
            font-size: 14px;
            color: var(--mut);
            font-weight: 600
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px
        }

        .f span {
            display: block;
            color: var(--mut);
            font-size: 12px;
            margin-bottom: 5px
        }

        input,
        select {
            width: 100%;
            background: var(--inp);
            color: var(--tx);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 10px;
            font: inherit
        }

        input[readonly],
        input:disabled,
        select:disabled {
            opacity: .7
        }

        .btn {
            background: var(--acc);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            font: 600 14px inherit;
            font-family: inherit;
            cursor: pointer
        }

        .btn.g {
            background: var(--card);
            color: var(--tx);
            border: 1px solid var(--line)
        }

        .btn.ok {
            background: var(--ok)
        }

        .btn.s {
            padding: 5px 10px;
            font-size: 12px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 620px
        }

        th {
            color: var(--mut);
            font-weight: 600;
            font-size: 12px;
            text-align: left;
            padding: 8px 6px
        }

        td {
            padding: 7px 6px;
            border-top: 1px solid var(--line);
            vertical-align: middle
        }

        td input {
            min-width: 70px
        }

        .tot td {
            font-weight: 700
        }

        .pill {
            display: inline-block;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px;
            background: rgba(128, 128, 128, .18)
        }

        .pill.ok {
            color: var(--ok);
            background: rgba(63, 157, 104, .16)
        }

        .pill.bad {
            color: var(--bad);
            background: rgba(212, 98, 62, .16)
        }

        .pill.warn {
            color: var(--warn);
            background: rgba(217, 164, 65, .16)
        }

        .months {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        .months button {
            background: var(--card);
            color: var(--tx);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 14px;
            font: 600 13px inherit;
            font-family: inherit;
            cursor: pointer
        }

        .months .on {
            background: var(--ok);
            border-color: var(--ok);
            color: #fff
        }

        .link {
            color: var(--acc);
            background: none;
            border: 0;
            font: 600 13px inherit;
            font-family: inherit;
            cursor: pointer;
            padding: 6px 0
        }

        .note,
        .fn {
            color: var(--mut);
            font-size: 12px;
            margin-top: 8px
        }

        .alert {
            background: rgba(212, 98, 62, .14);
            color: var(--bad);
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 14px
        }

        #toast {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: var(--ok);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            display: none;
            z-index: 9
        }

        .stat {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
            margin-bottom: 18px
        }

        .stat div {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px
        }

        .stat b {
            display: block;
            font-size: 22px;
            margin-top: 4px
        }

        @media (max-width:800px) {
            .app {
                grid-template-columns: 1fr
            }

            aside {
                padding: 12px
            }

            nav {
                display: flex;
                overflow-x: auto;
                gap: 4px
            }

            nav button {
                white-space: nowrap;
                width: auto
            }

            .who {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                margin-top: 10px;
                padding-top: 10px;
            }

            .who-actions {
                width: auto;
            }

            .btn-logout {
                width: auto;
                padding: 5px 12px;
            }

            main {
                padding: 18px 14px
            }
        }

        @media print {

            aside,
            .btn,
            .link,
            .top,
            .note,
            .noprint {
                display: none !important
            }

            .pg {
                page-break-after: always
            }

            .doc th,
            .doc td {
                padding: 4px 3px;
                font-size: 11px
            }

            .app {
                display: block
            }

            html,
            body,
            .card {
                background: #fff !important;
                color: #000 !important;
                border: 0
            }

            th,
            td {
                color: #000 !important;
                border-color: #bbb !important
            }

            .doc table {
                min-width: 0
            }
        }
    </style>
</head>

<body>
    <!-- Embedded Login View (displayed if not authenticated) -->
    <div id="loginScreen" class="auth-view" style="display:none">
        <div class="auth-container">
            <div class="brand-header">
                <div class="logo">UniBio Purchase<i>.</i></div>
                <div class="sub-brand">Unibio India Hatcheries Pvt Ltd</div>
                <div class="pill" style="margin-top:8px">ERP &bull; Material &amp; Purchase Portal</div>
            </div>

            <div class="auth-card">
                <h2>Account Sign In</h2>
                <p class="auth-desc">Log in to create POs, record GRNs, and view stock registers</p>

                <div id="appLoginMsg" class="msg-banner"></div>

                <form onsubmit="handleAppLogin(event)">
                    <div class="f" style="margin-bottom:14px">
                        <span>Username or Email</span>
                        <div class="input-wrap">
                            <input type="text" id="appUsername" placeholder="e.g. admin, manager, purchase" required
                                autocomplete="username">
                        </div>
                    </div>

                    <div class="f" style="margin-bottom:14px">
                        <span>Password</span>
                        <div class="input-wrap">
                            <input type="password" id="appPassword" placeholder="Enter password" required
                                autocomplete="current-password">
                            <button type="button" class="pw-toggle" onclick="toggleAppPassword()"
                                aria-label="Toggle password visibility">
                                <span id="appPwToggleText">Show</span>
                            </button>
                        </div>
                    </div>

                    <div class="f" style="margin-bottom:14px">
                        <span>Assigned Site / Facility</span>
                        <div class="input-wrap">
                            <select id="appSite">
                                <option value="Unibio (India) Hatcheries Pvt Ltd">Unibio (India) Hatcheries Pvt Ltd
                                </option>
                                <option value="Unit 2">Unit 2</option>
                                <option value="MKM-OS">MKM-OS</option>
                                <option value="NLR-OS">NLR-OS</option>
                                <option value="KKD-OS">KKD-OS</option>
                            </select>
                        </div>
                    </div>

                    <div class="row-options">
                        <label class="remember-wrap">
                            <input type="checkbox" id="appRememberMe" checked>
                            <span>Keep me signed in</span>
                        </label>
                    </div>

                    <button type="submit" id="appSubmitBtn" class="btn-submit">
                        <span>Sign In</span>
                        <span style="font-size:16px">&rarr;</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="app" id="app">
        <aside>
            <div class="logo">UniBio Purchase<i>.</i></div>
            <nav id="nav"></nav>
            <div class="who" id="who"></div>
        </aside>
        <main id="main"></main>
    </div>
    <div id="toast"></div>
    <script>
        const KEY = "unibio_purchase_v2", pad = n => String(n).padStart(3, "0"), inr = n => "₹" + Number(n || 0).toLocaleString("en-IN"), today = () => new Date().toISOString().slice(0, 10);
        const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

        /* ---------- Authentication & Session ---------- */
        const AUTH_KEY = "unibio_auth_user";
        const USERS = [
            { username: "admin", aliases: ["heyma"], password: "Heyma@123", name: "Heyma", role: "Management", site: "Unibio (India) Hatcheries Pvt Ltd", email: "management@unibio.in" },
            { username: "manager", aliases: ["ramesh"], password: "Manager@123", name: "Dr. K. Ramesh", role: "Hatchery Manager", site: "Unibio (India) Hatcheries Pvt Ltd", email: "manager@unibio.in" },
            { username: "purchase", aliases: ["ranjith"], password: "Ranjith@123", name: "Ranjith", role: "Purchase Executive", site: "Unit 2", email: "ranjith.purchase@unibio.in" },
            { username: "store", aliases: ["abinaya"], password: "Abinaya@123", name: "Abinaya", role: "Store In-charge", site: "Unibio (India) Hatcheries Pvt Ltd", email: "abinaya.stores@unibio.in" },
            { username: "accounts", aliases: ["balaji"], password: "Balaji@123", name: "Balaji", role: "Accounts Officer", site: "Unibio (India) Hatcheries Pvt Ltd", email: "balaji.acc@unibio.in" }
        ];

        let currentUser = null;

        function getAuthUser() {
            try {
                return JSON.parse(localStorage.getItem(AUTH_KEY) || sessionStorage.getItem(AUTH_KEY));
            } catch (e) {
                return null;
            }
        }

        function setAuthUser(user, remember = true) {
            if (remember) {
                localStorage.setItem(AUTH_KEY, JSON.stringify(user));
                sessionStorage.removeItem(AUTH_KEY);
            } else {
                sessionStorage.setItem(AUTH_KEY, JSON.stringify(user));
                localStorage.removeItem(AUTH_KEY);
            }
            currentUser = user;
        }

        function logout() {
            localStorage.removeItem(AUTH_KEY);
            sessionStorage.removeItem(AUTH_KEY);
            currentUser = null;
            toast("Signed out successfully");
            checkAuthAndDisplay();
        }

        function getInitials(name) {
            if (!name) return "UB";
            const parts = name.replace(/Dr\.|Mr\.|Mrs\.|Ms\./gi, "").trim().split(/\s+/);
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.slice(0, 2).toUpperCase();
        }

        function renderWho() {
            const el = document.getElementById("who");
            if (!el || !currentUser) return;
            const init = getInitials(currentUser.name);
            el.innerHTML = `
                <div class="who-card">
                    <div class="who-avatar" title="${esc(currentUser.name)}">${init}</div>
                    <div class="who-details">
                        <div class="who-name">${esc(currentUser.name)}</div>
                        <div class="who-role">${esc(currentUser.role || "Staff")}</div>
                        <div class="who-site" title="${esc(currentUser.site)}">${esc(currentUser.site)}</div>
                    </div>
                </div>
                <div class="who-actions">
                    <button class="btn-logout" onclick="logout()" title="Sign out of system">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Sign Out</span>
                    </button>
                </div>
            `;
        }

        function toggleAppPassword() {
            const pw = document.getElementById("appPassword");
            const btn = document.getElementById("appPwToggleText");
            if (pw.type === "password") {
                pw.type = "text";
                btn.textContent = "Hide";
            } else {
                pw.type = "password";
                btn.textContent = "Show";
            }
        }

        function showAppLoginMsg(type, text) {
            const box = document.getElementById("appLoginMsg");
            if (!box) return;
            box.className = "msg-banner " + type;
            box.textContent = text;
            box.style.display = "block";
        }

        function fillAppDemo(key) {
            const u = USERS.find(x => x.username === key);
            if (!u) return;
            document.getElementById("appUsername").value = u.username;
            document.getElementById("appPassword").value = u.password;
            document.getElementById("appSite").value = u.site;

            const h = ["Month", "Site", "Item", "Category", "Unit", "Opening Qty", "Received Qty", "Issued Qty", "Adjustment Qty", "Closing Qty", "Avg Rate", "Opening Value", "Received Value", "Issued Value", "Adjustment Value", "Closing Value", "Min Level", "Status"], out = [h.join(",")];
            (RS === "*" ? SITEN : [RS]).forEach(s => stockCalc(s, SM).rows.forEach(x => out.push([ymName(SM), s, x.item, x.cat, x.unit, x.oq, x.inq, x.outq, x.adq, x.cq, x.avg, x.ov, x.inv, x.outv, x.adv, x.cv, x.min, x.st].map(csvc).join(","))));
            dl("UniBio_stock_" + (RS === "*" ? "all_sites" : siteKey(RS).replace(/\W+/g, "_")) + "_" + SM + ".csv", out.join("\r\n"))
        }
        function copySummary() {
            const C = SITEN.map(s => stockCalc(s, SM)); let t = "Month-end stock - " + ymName(SM) + "\n";
            C.forEach(c => t += c.site + ": Opening " + inr(c.T.ov) + " | Received " + inr(c.T.inv) + " | Issued " + inr(c.T.outv) + " | Closing " + inr(c.T.cv) + (c.T.low ? " | Low/out items: " + c.T.low : "") + "\n");
            t += "Total closing: " + inr(r2(C.reduce((a, c) => a + c.T.cv, 0)));
            try { navigator.clipboard.writeText(t).then(() => toast("Summary copied - paste in WhatsApp or email"), () => toast("Copy blocked by browser")) } catch (e) { toast("Copy not available") }
        }

        /* ---------- shell ---------- */
        function render() {
            renderWho();
            const n = pending(); document.getElementById("nav").innerHTML = NAV.map(([k, l]) => `<button class="${k === cur || (k === "status" && (cur === "pod" || cur === "grnd") && 0) || (k === "po" && (cur === "pod" || cur === "poe")) || (k === "grnl" && cur === "grnd") || (k === "stock" && cur === "sled") ? "on" : ""}" onclick="go('${k}')">${l}${k === "appr" && n ? `<span class="badge">${n}</span>` : ""}</button>`).join("");
            const m = { stock: stockView, inout: inoutView, sled: ledgerView, sentry: entryView, mend: mendView, grnl: grnListView, po: poList, poe: poForm, pod: podView, pm: pmView, grn: grnView, grnd: grnDetail, bill: billView, status: statusView, tally: tallyView, recon: reconView, vendors: vendView, appr: apprView };
            document.getElementById("main").innerHTML = m[cur](); window.scrollTo(0, 0)
        }
        checkAuthAndDisplay();
    </script>
</body>
